[project]
name = "aether-kokoro-dataset"
version = "0.1.0"
description = "Kokoro TTS -> Moshi fine-tuning dataset generator for the Aether project."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "soundfile",
    "orjson",
    "tqdm",
]

[project.optional-dependencies]
# Installed separately on the Colab A100 runtime; see COLAB.md for exact
# pinned versions and the CUDA-specific torch/torchaudio install command.
colab = [
    "kokoro==0.9.4",
    "torch==2.6.0",
    "torchaudio==2.6.0",
]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kokoro_ds"]
